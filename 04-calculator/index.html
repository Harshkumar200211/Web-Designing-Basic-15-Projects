<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Calculator</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Calculator</h1><input id="a" type="number" placeholder="First number"><select id="op"><option value="+">Addition (+)</option><option value="-">Subtraction (-)</option><option value="*">Multiplication (×)</option><option value="/">Division (÷)</option></select><input id="b" type="number" placeholder="Second number"><div class="buttons"><button id="calculate">Calculate</button><button id="clear">Clear</button></div><p id="result" role="status">Result will appear here.</p></main><script src="script.js"></script></body></html>
