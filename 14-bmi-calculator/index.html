<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator</title><link rel="stylesheet" href="style.css"></head><body><main><p class="tag">HEALTH MATH DEMO</p><h1>BMI Calculator</h1><p class="intro">Enter your height and weight to calculate BMI.</p><form id="form"><label for="height">Height (cm)</label><input id="height" type="number" min="1" step="0.1" placeholder="e.g. 170" required><label for="weight">Weight (kg)</label><input id="weight" type="number" min="1" step="0.1" placeholder="e.g. 65" required><button>Calculate BMI</button></form><section id="result" hidden><p>Your BMI</p><strong id="value"></strong><b id="category"></b></section><small>BMI is a rough screening measure, not a medical diagnosis.</small></main><script src="script.js"></script></body></html>
