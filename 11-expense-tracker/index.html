<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="tag">PERSONAL FINANCE</p><h1>Money Overview</h1></div><b>₹</b></header><section class="balance"><p>YOUR BALANCE</p><h2 id="balance">₹0.00</h2><div><div><small>INCOME</small><b id="income">₹0.00</b></div><div><small>EXPENSES</small><b id="expenses">₹0.00</b></div></div></section><h3>Add transaction</h3><form id="form"><label>Description<input id="description" placeholder="Grocery shopping" required></label><div class="fields"><label>Amount (₹)<input id="amount" type="number" min="0.01" step="0.01" required></label><label>Type<select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></label></div><button>Add transaction</button></form><h3>Recent transactions</h3><ul id="transactions"></ul><p id="empty">No transactions added yet.</p><button id="reset" class="reset">Clear all demo data</button></main><script src="script.js"></script></body></html>
