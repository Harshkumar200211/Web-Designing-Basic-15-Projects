<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Form</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Create your account</h1><p>Practise validating form fields with JavaScript.</p><form id="form" novalidate><label for="name">Full name</label><input id="name" type="text" placeholder="Alex Morgan"><small id="nameError"></small><label for="email">Email address</label><input id="email" type="email" placeholder="alex@example.com"><small id="emailError"></small><label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters"><small id="passwordError"></small><label for="confirm">Confirm password</label><input id="confirm" type="password"><small id="confirmError"></small><button>Create account</button><p id="success" role="status"></p></form></main><script src="script.js"></script></body></html>
