<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><link rel="stylesheet" href="style.css"></head><body><main><p class="tag">SECURITY TOOL DEMO</p><h1>Password Generator</h1><label for="length">Password length: <b id="lengthValue">16</b></label><input id="length" type="range" min="8" max="32" value="16"><fieldset><legend>Include characters</legend><label><input id="lower" type="checkbox" checked> Lowercase</label><label><input id="upper" type="checkbox" checked> Uppercase</label><label><input id="numbers" type="checkbox" checked> Numbers</label><label><input id="symbols" type="checkbox"> Symbols</label></fieldset><div class="output"><input id="password" readonly placeholder="Password appears here"><button id="copy">Copy</button></div><button id="generate">Generate Password</button><p id="message" role="status"></p><small>For learning purposes. Use a trusted password manager for real accounts.</small></main><script src="script.js"></script></body></html>
